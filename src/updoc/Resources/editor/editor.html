<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { 
      height: 100%; 
      overflow: hidden; 
      background: var(--updoc-bg, white); 
      color: var(--updoc-text, black);
      font-family: var(--updoc-font-family, -apple-system, sans-serif);
      font-size: var(--updoc-font-size, 16px);
    }
    #editor { height: 100%; }
    .cm-editor { height: 100%; color: inherit !important; }
    .cm-content { color: inherit !important; }
    .cm-scroller { overflow: auto; height: 100%; }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="editor.js"></script>
</body>
</html>
